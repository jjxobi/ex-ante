[project]
name = "ex-ante"
version = "0.1.0"
description = "Ex Ante: a publicly scored New Zealand earthquake rate forecast"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandas>=2.2",
    # Used by the expander for canonical little-endian byte layout. D13.5
    # makes determinism a claim about the dependency set as much as about the
    # code, so this is declared explicitly rather than relied on transitively.
    "numpy>=1.26",
    # eq.adaptive's k-th nearest neighbour search (cKDTree), per D13.4b. Was
    # already present transitively through pyCSEP's dev-only dependency, but
    # eq.adaptive is core src code, not a test, so it is declared explicitly
    # here rather than left to arrive as a side effect of installing dev
    # extras, the same reasoning the numpy line above already states.
    "scipy>=1.11",
    # eq.score runs the CSEP consistency tests through pyCSEP, and eq.cli
    # reaches it via eq.render, so a base install that omits this cannot even
    # import the command line entry point. It sat under dev extras until the
    # health workflow, which installs no extras, died at import time with an
    # empty stdout. Same reasoning as scipy above: eq.score is core src code,
    # not a test, so the dependency is declared where the code actually lives.
    # It also happens to be what the pyCSEP agreement tests import.
    "pycsep>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "dbt-duckdb>=1.10",
    "hypothesis>=6.100",
]

[project.scripts]
eq = "eq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
