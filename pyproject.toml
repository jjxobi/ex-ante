[project]
name = "ex-ante"
version = "0.1.0"
description = "Ex Ante: a publicly scored New Zealand earthquake rate forecast"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandas>=2.2",
    # Used by the expander for canonical little-endian byte layout. D13.5
    # makes determinism a claim about the dependency set as much as about the
    # code, so this is declared explicitly rather than relied on transitively.
    "numpy>=1.26",
    # eq.anchor's OpenTimestamps anchor, per D10. This is the `opentimestamps`
    # library (python-opentimestamps), not `opentimestamps-client`: the CLI
    # package imports bitcoin.rpc, which imports bitcoin.wallet, which loads
    # OpenSSL via ctypes.util.find_library, which returns None on Windows and
    # crashes on import before doing anything. eq.anchor talks to calendar
    # servers directly through opentimestamps.calendar and never imports
    # otsclient, so only this lighter dependency is needed and it works
    # everywhere this project runs.
    "opentimestamps>=0.4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "dbt-duckdb>=1.10",
    "hypothesis>=6.100",
    # Declared so the pyCSEP agreement tests run in CI rather than skipping.
    # The design spec previously assumed this was Linux only; it installs on
    # Windows too, with pip install --user where the system Python's Scripts
    # directory is not writable.
    "pycsep>=0.8",
]

[project.scripts]
eq = "eq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
