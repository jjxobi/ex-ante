name: forecast

# Daily publication cycle: ingest, publish the next daily and weekly windows
# for both registered models and both strata (8 forecasts), score every
# window whose T+45 freeze has come due, render the static scoreboard, and
# commit the result. Design spec section 4 (the architecture diagram) and
# section 5 (Rule 1, Rule 3).
#
# WHY 22:00 UTC. Both horizons' windows open at UTC midnight (D12). D10 sets
# publication lead time at T minus 2 hours, so one cron time, 22:00 UTC,
# is T-2h for tomorrow's daily window AND, on the one day a week it matters,
# T-2h for the coming Monday's weekly window. eq.publish's own refusal
# boundary is the window START, not this schedule (see eq/publish.py's
# module docstring), so routine GitHub Actions cron delay costs nothing.
#
# WHY COMMITS HERE ARE AUTHORED github-actions[bot]. Per DECISIONS.md D10:
# "Scheduled workflow commits are authored github-actions[bot]. Human
# commits are authored Jesse O'Brien <jesse@jesse-obrien.com>. These are
# deliberately distinguishable so that any human touch in the forecast
# history is visible to a reader." The git identity below is set explicitly
# in this job rather than inherited from any default, for exactly that
# reason.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forecast-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert the frozen region grid is intact
        # Every downstream component asserts this on its own before doing
        # anything (D1), but failing here first gives a clearer signal than
        # a mismatch surfacing three steps later inside a model fit.
        run: |
          python -c "from eq import region; print('grid hash', region.grid_hash())"

      - name: Ingest today's full catalogue snapshot
        # Local, ephemeral pipeline input (design spec 4.1): the snapshot
        # itself is never committed, only what is derived from it below is.
        run: python -m eq.cli snapshot

      - name: Publish the next daily and weekly windows
        # 2 models x 2 horizons x 2 strata = 8 forecasts. Rule 1 (D11) is
        # enforced per window inside eq.publish.publish_forecast: this step
        # fails loudly, rather than silently publishing fewer than 8, if any
        # single window's start has already passed.
        run: python -m eq.cli publish-cycle

      - name: Score due windows and render the scoreboard
        # eq.cli render calls eq.render.build_scoreboard, which for every
        # window in a (model, horizon, stratum)'s history either finds the
        # window already scored, freezes and scores it if T+45 has now
        # passed (eq.freeze, writing the committed T+45 evaluation catalogue
        # per D7 / Rule 3), or renders it as a permanent NEVER_PUBLISHED gap
        # if no forecast was ever committed for it (Rule 1 / D11). This is
        # the "score" and "render" pipeline stages from the design spec's
        # architecture diagram run together, once per forecast type.
        run: |
          set -e
          for model in baseline adaptive; do
            for horizon in daily weekly; do
              for stratum in shallow deep; do
                python -m eq.cli render --model "$model" --horizon "$horizon" --stratum "$stratum"
              done
            done
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add aborts the whole staging operation, and stages nothing, if
          # any single pathspec matches no file. All three directories do exist
          # by this point today: evaluation/ is tracked so checkout restores it,
          # publish-cycle creates forecasts/, and the render step creates site/.
          # The hazard is what happens if that ever stops being true, which is
          # out of proportion to its cause. The run would have already published
          # its windows, and discarding them here means Rule 1 forbids ever
          # republishing them: those windows become permanent gaps in the record.
          # So require the directory this step exists to commit, and take the
          # other two only if something wrote them.
          if [ ! -d forecasts ]; then
            echo "publish-cycle produced no forecasts directory" >&2
            exit 1
          fi
          for path in forecasts evaluation site; do
            if [ -d "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Publish, score and render: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
