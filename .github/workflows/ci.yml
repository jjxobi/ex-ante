name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        # Derandomised hypothesis, so a property failure found here reproduces
        # exactly on a developer machine with the same profile. The default
        # seeds randomly and caches counterexamples in a .hypothesis directory
        # that CI discards, which would make a CI-only failure unreproducible
        # in a project whose central claim is reproducibility.
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest -v

      - name: Ingest a recent catalogue slice
        # The output filename must be date shaped. stg_quakes selects the
        # newest snapshot by lexical maximum over a catalogue-????-??-??
        # pattern, and a name like catalogue-ci.parquet would both fall outside
        # that pattern and, under a looser one, sort after every real date
        # because 'c' sorts after '2'.
        run: |
          START=$(date -u -d '30 days ago' +%Y-%m-%d)
          END=$(date -u -d 'tomorrow' +%Y-%m-%d)
          TODAY=$(date -u +%Y-%m-%d)
          python -m eq.cli range \
            --start "$START" --end "$END" \
            --min-magnitude 3.0 \
            --out "data/snapshots/catalogue-${TODAY}.parquet"

      # WHAT THIS STEP PROVES, AND WHAT IT DOES NOT.
      #
      # It builds against a 30 day slice, about 200 events, not the full 61,000
      # event catalogue. That is deliberate: a full pull takes minutes and
      # hammers GeoNet on every push. The consequence is that four of the ten
      # data contract tests are INERT here, passing because they have nothing
      # to look at rather than because the contract holds:
      #
      #   assert_depthtype_share            needs 2000 M3.5+ events, slice has ~92
      #   assert_no_exact_duplicate_events  the only known duplicate is from 2018
      #   assert_no_duplicate_origins       same 2018 pair
      #   assert_withdrawals_within_bound   one snapshot, so no previous to diff
      #
      # So a green run here means the pipeline executes end to end and the
      # row-level contracts hold. It does NOT mean the full catalogue contracts
      # hold. Those are verified by running the full build locally, and are the
      # reason docs/runbook.md tells you never to relax a bound to make a test
      # pass. See docs/phase-2-preconditions.md for the standing gap.
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
