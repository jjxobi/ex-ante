name: health

# Notices when the daily forecast workflow has stopped, before a reader has
# to. Design spec section 4.7: "Fails if the newest forecast is more than 48
# hours old, opening or updating a GitHub issue." The risk stated there:
# GitHub Actions disables a scheduled workflow after roughly 60 days of
# repository inactivity, and that disabling is silent, which is fatal for a
# project whose entire premise is uninterrupted daily operation.
#
# Runs on its own schedule, separate from forecast.yml, so a check that only
# ran as a step of the workflow it is supposed to detect the silence of
# would never fire; a workflow that has been disabled does not run its own
# health check either.
#
# eq.health does not talk to GitHub itself (see src/eq/health.py's module
# docstring): it returns a healthy flag plus fully formed issue title/body
# text, and this workflow is where that text actually becomes a GitHub
# issue, found or created by searching for eq.health.ISSUE_MARKER embedded
# in the issue body, so repeat failures update one issue rather than opening
# a new one every run, and a recovery closes it.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Deliberately a base install with no extras. This is the only
          # workflow that runs the package the way an outside installer would,
          # so it is also the one place that would notice a core module reaching
          # for a dev-only dependency. It noticed once already.
          python -m pip install -e .

      - name: Run the health check
        id: health
        run: |
          set +e
          python -m eq.cli health > health.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat health.json
          # A non-zero exit is how the command reports unhealthy, so it must not
          # fail this step. Output that is not the expected JSON is a different
          # thing entirely: it means the command never ran. Catch that here,
          # where its traceback is on screen, instead of leaving the issue step
          # to fail on an empty file and look like broken CI.
          python - <<'PY'
          import json
          import pathlib
          import sys

          raw = pathlib.Path("health.json").read_text()
          if not raw.strip():
              sys.exit("the health command wrote nothing; see the traceback above")
          try:
              report = json.loads(raw)
          except json.JSONDecodeError as exc:
              sys.exit(f"the health command did not write JSON: {exc}")

          # Unpacked once, here, so the reporting steps below cannot each fail
          # in their own way, and so a missing field is caught even on the
          # healthy path where nothing else would read it.
          for field in ("issue_title", "issue_body", "issue_marker", "reason"):
              if field not in report:
                  sys.exit(f"the health report is missing {field!r}")
              pathlib.Path(f"health-{field}.txt").write_text(report[field])
          PY

      - name: Open or update an issue if unhealthy
        if: steps.health.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Read from the files the health step wrote. The body is passed by
          # path rather than through a shell variable because it is multi-line
          # and command substitution eats its trailing newlines.
          MARKER=$(cat health-issue_marker.txt)
          EXISTING=$(gh issue list --state open --search "$MARKER in:body" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file health-issue_body.txt
          else
            gh issue create --title "$(cat health-issue_title.txt)" --body-file health-issue_body.txt
          fi

      - name: Close a previously open issue once healthy again
        if: steps.health.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          MARKER=$(cat health-issue_marker.txt)
          REASON=$(cat health-reason.txt)
          EXISTING=$(gh issue list --state open --search "$MARKER in:body" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Healthy again: $REASON"
            gh issue close "$EXISTING"
          fi
